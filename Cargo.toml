[package]
name = "aic-tools"
version = "0.1.0"
edition = "2024"
description = "Alice In Cradle runtime memory tools (no Cheat Engine)"
license = "MIT"
publish = false

[[bin]]
name = "aic-tools"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
panic = "abort"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Time",
    "Win32_System_Threading",
] }
